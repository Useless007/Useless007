<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 158" width="436" height="158" role="img" aria-label="btc-rainbow-worker: Cron Worker that computes the Bitcoin power-law band from the formula, with three price sources behind a fallback chain.">
<title>btc-rainbow-worker: Cron Worker that computes the Bitcoin power-law band from the formula, with three price sources behind a fallback chain.</title>
<style>
  svg{--ink:#1f2328;--dim:#59636e;--faint:#818b98;--line:#d1d9e0;--accent:#0969da;--ok:#1a7f37}
  @media (prefers-color-scheme:dark){svg{--ink:#e6edf3;--dim:#8b949e;--faint:#6e7681;--line:#2c333c;--accent:#58a6ff;--ok:#3fb950}}
  text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
  .panel{fill:none;stroke:var(--line);stroke-width:1}
  .name{font-size:15px;font-weight:700;fill:var(--ink)}
  .desc{font-size:12px;fill:var(--dim)}
  .chip{fill:none;stroke:var(--line);stroke-width:1}
  .chipt{font-size:10.5px;fill:var(--faint);text-anchor:middle}
</style>
<rect class="panel" x=".5" y=".5" width="435" height="157" rx="12"/>
<text class="name" x="22" y="38">btc-rainbow-worker</text>
<text class="desc" x="22" y="66">Cron Worker that computes the Bitcoin power-law band</text><text class="desc" x="22" y="84">from the formula, with three price sources behind a</text><text class="desc" x="22" y="102">fallback chain.</text>
<rect class="chip" x="22.0" y="116" width="79.2" height="20" rx="5"/><text class="chipt" x="61.6" y="129.8">TypeScript</text><rect class="chip" x="107.2" y="116" width="129.8" height="20" rx="5"/><text class="chipt" x="172.1" y="129.8">Cloudflare Workers</text><rect class="chip" x="243.0" y="116" width="35.0" height="20" rx="5"/><text class="chipt" x="260.5" y="129.8">Bun</text>
