<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 158" width="436" height="158" role="img" aria-label="content-blueprint: Windows app for content teams. It drives the Claude Code or Codex CLI you already use, re-checks every result in Go and never publishes for you.">
<title>content-blueprint: Windows app for content teams. It drives the Claude Code or Codex CLI you already use, re-checks every result in Go and never publishes for you.</title>
<style>
  svg{--ink:#1f2328;--dim:#59636e;--faint:#818b98;--line:#d1d9e0;--accent:#0969da;--ok:#1a7f37}
  @media (prefers-color-scheme:dark){svg{--ink:#e6edf3;--dim:#8b949e;--faint:#6e7681;--line:#2c333c;--accent:#58a6ff;--ok:#3fb950}}
  text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
  .panel{fill:none;stroke:var(--line);stroke-width:1}
  .name{font-size:15px;font-weight:700;fill:var(--ink)}
  .desc{font-size:12px;fill:var(--dim)}
  .chip{fill:none;stroke:var(--line);stroke-width:1}
  .chipt{font-size:10.5px;fill:var(--faint);text-anchor:middle}
</style>
<rect class="panel" x=".5" y=".5" width="435" height="157" rx="12"/>
<text class="name" x="22" y="38">content-blueprint</text>
<text class="desc" x="22" y="66">Windows app for content teams. It drives the Claude</text><text class="desc" x="22" y="84">Code or Codex CLI you already use, re-checks every</text><text class="desc" x="22" y="102">result in Go and never publishes for you.</text>
