<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" role="img" aria-label="useless007 — full-stack developer, Thailand">
<title>useless007</title>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#2c333c"/>
  </pattern>
  <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.45" stop-color="#fff" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0.9"/>
  </linearGradient>
  <mask id="gridMask"><rect width="880" height="190" fill="url(#gridFade)"/></mask>
  <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="sheen">
    <rect class="sheenbar" x="-260" y="0" width="220" height="190" fill="url(#sheenGrad)"/>
  </mask>
</defs>
<style>
  text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace;}
  .panel{fill:none;stroke:#2c333c;stroke-width:1}
  .eyebrow{font-size:11.5px;letter-spacing:3.6px;fill:#6e7681;animation:fade .9s ease-out .05s backwards}
  .dot{fill:#58a6ff;animation:pulse 3.2s ease-in-out infinite}
  .name{font-size:58px;font-weight:700;letter-spacing:-2px;fill:#e6edf3}
  .l{animation:fade .55s ease-out backwards}
  .l0{animation-delay:0.180s}.l1{animation-delay:0.235s}.l2{animation-delay:0.290s}.l3{animation-delay:0.345s}.l4{animation-delay:0.400s}.l5{animation-delay:0.455s}.l6{animation-delay:0.510s}.l7{animation-delay:0.565s}.l8{animation-delay:0.620s}.l9{animation-delay:0.675s}
  .sheentext{font-size:58px;font-weight:700;letter-spacing:-2px;fill:#58a6ff}
  .sheenbar{animation:sweepx 9s cubic-bezier(.4,0,.2,1) 1.6s infinite}
  .rule{stroke:#58a6ff;stroke-width:2;stroke-linecap:round;stroke-dasharray:120;animation:draw 1.1s cubic-bezier(.2,.7,.2,1) .75s backwards}
  .caret{fill:#58a6ff;animation:blink 2.4s steps(1) infinite}
  .rot{font-size:15px;fill:#8b949e;opacity:0;animation:cycle 24s ease-in-out infinite}
  .r0{opacity:1}
  .r0{animation-delay:0s}.r1{animation-delay:6s}.r2{animation-delay:12s}.r3{animation-delay:18s}
  .ring{fill:none;stroke:#2c333c;stroke-width:1}
  .cross{stroke:#2c333c;stroke-width:1;opacity:.7}
  .wedge{fill:#58a6ff;opacity:.10}
  .spin{transform-origin:772px 95px;animation:spin 8.0s linear infinite}
  .beam{stroke:#58a6ff;stroke-width:1.4;opacity:.75}
  .blip{fill:#58a6ff;opacity:0;animation:blip 8.0s linear infinite}
  .b0{animation-delay:0.78s}.b1{animation-delay:3.33s}.b2{animation-delay:5.67s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes sweepx{0%{transform:translateX(0)}45%,100%{transform:translateX(720px)}}
  @keyframes draw{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.15}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes blip{0%{opacity:.95}30%{opacity:0}100%{opacity:0}}
  @keyframes cycle{0%{opacity:0}2%{opacity:1}22%{opacity:1}25%,100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){
    .l,.eyebrow{animation:none}
    .sheenbar,.dot,.caret,.spin,.blip{animation:none}
    .rule{animation:none}
    .rot{animation:none}
  }
</style>
<rect width="880" height="190" rx="16" fill="url(#grid)" mask="url(#gridMask)" opacity=".55"/>
<rect class="panel" x=".5" y=".5" width="879" height="189" rx="16"/>

<circle class="dot" cx="49" cy="45" r="3"/>
<text class="eyebrow" x="62" y="49">THAILAND</text>

<text class="name" x="46" y="112"><tspan class="l l0">u</tspan><tspan class="l l1">s</tspan><tspan class="l l2">e</tspan><tspan class="l l3">l</tspan><tspan class="l l4">e</tspan><tspan class="l l5">s</tspan><tspan class="l l6">s</tspan><tspan class="l l7">0</tspan><tspan class="l l8">0</tspan><tspan class="l l9">7</tspan></text>
<text class="sheentext" x="46" y="112" mask="url(#sheen)" aria-hidden="true">useless007</text>

<path class="rule" d="M48 132 H168"/>

<rect class="caret" x="48" y="151" width="2" height="16" rx="1"/>
<text class="rot r0" x="66" y="163">go services, next.js in front, postgres underneath</text><text class="rot r1" x="66" y="163">local models on my own gpu, not someone else's api</text><text class="rot r2" x="66" y="163">telegram bots that run themselves on cron</text><text class="rot r3" x="66" y="163">zig for the small sharp tools</text>

<circle class="ring" cx="772" cy="95" r="52"/>
<circle class="ring" cx="772" cy="95" r="35" opacity=".8"/>
<circle class="ring" cx="772" cy="95" r="18" opacity=".6"/>
<line class="cross" x1="720" y1="95" x2="824" y2="95"/>
<line class="cross" x1="772" y1="43" x2="772" y2="147"/>
<circle class="blip b0" cx="796.57" cy="112.21" r="2.6"/><circle class="blip b1" cx="733.89" cy="117.00" r="2.6"/><circle class="blip b2" cx="767.34" cy="77.61" r="2.6"/>
<g class="spin">
  <path class="wedge" d="M772 95 L824 95 A52 52 0 0 1 799.56 139.10 Z"/>
  <line class="beam" x1="772" y1="95" x2="824" y2="95"/>
</g>
</svg>
